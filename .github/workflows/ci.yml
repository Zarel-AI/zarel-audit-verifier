# Tests every package under packages/ on each pull request and push, and stages a release from `main`.
#
# A package is staged only when the version in its package.json is not on npm yet, and each staged
# version is tagged `<package>-v<version>`. A version already staged and still awaiting approval is
# not visible to `npm view`, and this workflow's OIDC token cannot run `npm stage list`, so npm's
# refusal to stage it twice is read as "already staged" and the step goes on. npm authenticates this workflow through trusted
# publishing (OIDC), so the repository holds no npm token, and every tarball carries a provenance
# attestation that links it to this repository and commit.
#
# This workflow can only STAGE. A staged version is not installable until a maintainer approves it
# on npmjs.com with two-factor authentication, so a compromised repository or workflow cannot put
# a version of a verifier in front of its users on its own.

name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    packages:
        name: List the packages
        runs-on: ubuntu-latest
        outputs:
            list: ${{ steps.list.outputs.list }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - id: list
              run: echo "list=$(ls -d packages/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

    test:
        name: ${{ matrix.package }} on Node ${{ matrix.node }}
        needs: packages
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJSON(needs.packages.outputs.list) }}
                node: [18, 20, 22]
        defaults:
            run:
                working-directory: packages/${{ matrix.package }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install --no-audit --no-fund
            - run: npm test
            - name: Type-check the tests too
              run: if [ -f tsconfig.test.json ]; then npx tsc -p tsconfig.test.json; fi
            - run: npm run build

    publish:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write # push the release tags
            id-token: write # npm trusted publishing and provenance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: Use an npm that can stage a publish (11.15.0 or later)
              run: npm install -g npm@^11.15.0
            - name: Stage each package whose version is not on npm yet
              run: |
                  set -euo pipefail
                  for dir in packages/*/; do
                      name=$(node -p "require('./${dir}package.json').name")
                      version=$(node -p "require('./${dir}package.json').version")
                      if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
                          echo "${name}@${version} is already on npm"
                          continue
                      fi
                      (cd "$dir" && npm install --no-audit --no-fund)
                      if out=$(cd "$dir" && npm stage publish --provenance --access public 2>&1); then
                          echo "$out"
                          echo "${name}@${version} is staged; approve it on npmjs.com to publish it"
                      elif grep -qE 'code E409' <<<"$out"; then
                          echo "$out"
                          echo "${name}@${version} is already staged and awaiting approval on npmjs.com"
                      else
                          echo "$out"
                          exit 1
                      fi
                      tag="${name#@zarel-ai/}-v${version}"
                      if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
                          echo "tag ${tag} already exists"
                      else
                          status=$?
                          # 2 is ls-remote's "no such ref"; anything else is a remote that could not answer.
                          [ "$status" -eq 2 ] || exit "$status"
                          git tag "$tag"
                          git push origin "$tag"
                      fi
                  done
