# Tests every package on each pull request and push, and publishes from `main`.
#
# Publishing is idempotent: a package is published only when the version in its package.json is
# not on npm yet, and each publish is tagged `<package>-v<version>`. npm authenticates this
# workflow through trusted publishing (OIDC), so the repository holds no npm token, and every
# publish carries a provenance attestation that links the tarball to this repository and commit.

name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        name: ${{ matrix.package }} on Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: [audit-chain, audit-tsa]
                node: [18, 20, 22]
        defaults:
            run:
                working-directory: packages/${{ matrix.package }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install --no-audit --no-fund
            - run: npm test
            - name: Type-check the tests too
              run: if [ -f tsconfig.test.json ]; then npx tsc -p tsconfig.test.json; fi
            - run: npm run build

    publish:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write # push the release tags
            id-token: write # npm trusted publishing and provenance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: Use an npm that supports trusted publishing (11.5.1 or later)
              run: npm install -g npm@^11.5.1
            - name: Publish each package whose version is not on npm yet
              run: |
                  set -euo pipefail
                  for dir in packages/*/; do
                      name=$(node -p "require('./${dir}package.json').name")
                      version=$(node -p "require('./${dir}package.json').version")
                      if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
                          echo "${name}@${version} is already on npm"
                          continue
                      fi
                      (cd "$dir" && npm install --no-audit --no-fund && npm publish --provenance --access public)
                      tag="${name#@zarel-ai/}-v${version}"
                      git tag "$tag"
                      git push origin "$tag"
                  done
